name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[embed,index,api,dev]"

      - name: Selftest (26 invariants, zero-network)
        run: python -m qiming.cli selftest

      - name: Pytest (hermetic suite)
        run: pytest tests/ -v

      - name: Benchmark (golden corpus)
        run: python -m benchmarks.bench
